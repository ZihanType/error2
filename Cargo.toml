[workspace]
resolver = "3"
members = ["error2", "error2-derive"]

[workspace.package]
version = "0.14.0"
edition = "2024"
readme = "README.md"
repository = "https://github.com/ZihanType/error2"
license = "MIT/Apache-2.0"
include = ["Cargo.toml", "src/**/*"]

[workspace.dependencies]
# self
error2-derive = { path = "./error2-derive", version = "0.14.0", default-features = false }

append-only-vec = { version = "0.1", default-features = false }
futures-core = { version = "0.3", default-features = false }
heck = { version = "0.5", default-features = false }
pin-project-lite = { version = "0.2", default-features = false }
# dependencies
proc-macro2 = { version = "1", default-features = false }
quote = { version = "1", default-features = false }
regex = { version = "1", default-features = false }
scc = { version = "3", default-features = false }
serde = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false }
syn = { version = "2", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
private_bounds = "deny"
private_interfaces = "deny"
unreachable_pub = "deny"
unsafe_code = "forbid"
