[package]
name = "error2"
version.workspace = true
edition.workspace = true
description = "A simple error handle library for Rust"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["error", "library"]
include.workspace = true

[dependencies]
append-only-vec = { workspace = true }
scc = { workspace = true }

error2-derive = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
pin-project-lite = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive", "std"], optional = true }

[dev-dependencies]
regex = { workspace = true, features = ["unicode"] }
serde_json = { workspace = true, features = ["std"] }

[features]
default = ["derive"]
derive = ["dep:error2-derive"]
future = ["dep:pin-project-lite"]
runtime-check = ["error2-derive?/runtime-check"]
serde = ["dep:serde"]
stream = ["dep:futures-core", "dep:pin-project-lite"]

[lints]
workspace = true
